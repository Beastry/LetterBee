services:
  postgres:
    image: postgres:17-alpine
    container_name: zhiduan-qingchang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhiduan_qingchang
      POSTGRES_USER: zhiduan
      POSTGRES_PASSWORD: zhiduan_dev_password
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiduan -d zhiduan_qingchang"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
